<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>시안 6 — TDS Mobile (토스 디자인 시스템) 전용 시안</title>
  <style>
    :root {
      --grey50: #f9fafb;
      --grey100: #f2f4f6;
      --grey200: #e5e8eb;
      --grey300: #d1d6db;
      --grey400: #b0b8c1;
      --grey500: #8b95a1;
      --grey600: #6b7684;
      --grey700: #4e5968;
      --grey800: #333d4b;
      --grey900: #191f28;
      --blue50: #e8f3ff;
      --blue100: #c9e2ff;
      --blue500: #3182f6;
      --blue600: #2272eb;
      --red50: #ffeeee;
      --red500: #f04452;
      --green50: #e8f8f0;
      --green600: #03b26c;
    }

    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--grey100);
      color: var(--grey900);
      font-family: "Pretendard Variable", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
      line-height: 1.5;
    }

    .app {
      max-width: 460px;
      margin: 0 auto;
      min-height: 100dvh;
      background: #ffffff;
      padding-bottom: 76px;
    }

    /* TDS Navigation Bar */
    .tds-navbar {
      position: sticky; top: 0; z-index: 20;
      height: 52px; padding: 0 20px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      display: flex; align-items: center; justify-content: space-between;
    }
    .tds-brand { font-size: 20px; font-weight: 800; letter-spacing: -0.03em; color: var(--grey900); }
    .tds-nav-pill {
      font-size: 13px; font-weight: 600; color: var(--grey700);
      background: var(--grey100); padding: 6px 12px; border-radius: 999px;
      border: 0; font-family: inherit; cursor: pointer;
    }

    /* TDS Top Component */
    .tds-top { padding: 16px 20px 14px; }
    .tds-top-sub { font-size: 14px; font-weight: 600; color: var(--blue500); margin-bottom: 4px; }
    .tds-t2 { margin: 0; font-size: 24px; line-height: 33px; font-weight: 700; letter-spacing: -0.025em; color: var(--grey900); word-break: keep-all; }
    .tds-t4 { margin: 0; font-size: 19px; line-height: 27px; font-weight: 700; letter-spacing: -0.02em; color: var(--grey900); }
    .tds-caption { margin: 6px 0 0; font-size: 14px; line-height: 21px; color: var(--grey600); }

    /* TDS Section Divider (토스 앱 특유의 12px grey100 구분) */
    .tds-gap { height: 12px; background: var(--grey100); }
    .tds-section { padding: 20px 0 12px; }
    .tds-sec-head { padding: 0 20px 8px; display: flex; align-items: center; justify-content: space-between; }
    .tds-sec-title { margin: 0; font-size: 18px; font-weight: 700; color: var(--grey900); letter-spacing: -0.02em; }
    .tds-sec-more { font-size: 13px; font-weight: 600; color: var(--grey500); background: none; border: 0; cursor: pointer; font-family: inherit; }

    /* TDS ListRow Component */
    .tds-listrow {
      width: 100%; border: 0; background: transparent; text-align: left; font-family: inherit;
      padding: 13px 20px; display: flex; align-items: center; gap: 14px; cursor: pointer;
      transition: background-color 120ms ease;
    }
    .tds-listrow:active { background: var(--grey100); }
    .tds-lr-left {
      width: 44px; height: 44px; border-radius: 14px; flex-shrink: 0;
      background: var(--grey100); display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; color: var(--grey700); overflow: hidden;
    }
    .tds-lr-left.is-thumb { width: 56px; height: 56px; border-radius: 12px; background: linear-gradient(135deg, #3182f6, #1b64da); color: #fff; font-size: 12px; }
    .tds-lr-left.is-blue { background: var(--blue50); color: var(--blue500); }
    .tds-lr-left.is-green { background: var(--green50); color: var(--green600); }
    .tds-lr-contents { flex: 1; min-width: 0; }
    .tds-lr-title { font-size: 16px; line-height: 23px; font-weight: 600; color: var(--grey800); word-break: keep-all; }
    .tds-lr-sub { font-size: 13px; line-height: 19px; color: var(--grey600); margin-top: 2px; }
    .tds-lr-right { flex-shrink: 0; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: var(--grey600); }
    .tds-chevron { color: var(--grey400); font-size: 16px; }

    /* TDS Badge */
    .tds-badge {
      display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 6px;
      font-size: 12px; font-weight: 600; line-height: 16px;
    }
    .tds-badge.blue { background: var(--blue50); color: var(--blue500); }
    .tds-badge.red { background: var(--red50); color: var(--red500); }
    .tds-badge.green { background: var(--green50); color: var(--green600); }
    .tds-badge.grey { background: var(--grey100); color: var(--grey700); }

    /* TDS Weak/Primary Button */
    .tds-btn-wrap { padding: 8px 20px 14px; display: flex; gap: 8px; }
    .tds-btn {
      flex: 1; height: 48px; border: 0; border-radius: 14px; font-family: inherit;
      font-size: 15px; font-weight: 600; cursor: pointer; transition: transform 120ms ease, background-color 120ms ease;
    }
    .tds-btn:active { transform: scale(0.985); }
    .tds-btn.primary { background: var(--blue500); color: #ffffff; }
    .tds-btn.primary:active { background: var(--blue600); }
    .tds-btn.weak { background: var(--blue50); color: var(--blue500); }
    .tds-btn.dark-weak { background: var(--grey100); color: var(--grey700); }

    /* TDS Meal Chips (Compact & Crisp) */
    .tds-dish-box { padding: 4px 20px 14px; display: flex; flex-wrap: wrap; gap: 6px; }
    .tds-chip {
      padding: 6px 11px; border-radius: 8px; background: var(--grey50);
      font-size: 14px; font-weight: 500; color: var(--grey800);
    }
    .tds-chip.is-warn { background: var(--red50); color: var(--red500); font-weight: 600; }

    /* TDS Tab Bar (Underline Fluid Tabs) */
    .tds-tabs {
      display: flex; border-bottom: 1px solid var(--grey200); padding: 0 20px; gap: 20px; overflow-x: auto;
    }
    .tds-tab {
      border: 0; background: transparent; padding: 12px 2px; font-family: inherit;
      font-size: 15px; font-weight: 600; color: var(--grey500); cursor: pointer;
      border-bottom: 2px solid transparent; white-space: nowrap;
    }
    .tds-tab.is-active { color: var(--grey900); border-bottom-color: var(--grey900); }

    /* TDS Ledger Box */
    .tds-ledger {
      margin: 12px 20px; padding: 16px; border-radius: 16px; background: var(--grey50);
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center;
    }
    .tds-ledger-lbl { font-size: 12px; color: var(--grey600); display: block; }
    .tds-ledger-val { font-size: 15px; font-weight: 700; color: var(--grey900); margin-top: 2px; display: block; }

    /* TDS Bottom Tab Bar */
    .tds-bottom-nav {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 460px; height: 60px; padding-bottom: env(safe-area-inset-bottom, 0);
      background: #ffffff; border-top: 1px solid var(--grey200);
      display: grid; grid-template-columns: repeat(4, 1fr); z-index: 20;
    }
    .tds-bnav-btn {
      border: 0; background: transparent; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 3px; cursor: pointer;
      font-family: inherit; font-size: 11px; font-weight: 600; color: var(--grey500);
    }
    .tds-bnav-btn svg { width: 22px; height: 22px; fill: currentColor; }
    .tds-bnav-btn[aria-current="page"] { color: var(--grey900); }

    /* TDS BottomSheet Dialog */
    dialog.tds-sheet {
      margin: auto auto 0; width: 100%; max-width: 460px; max-height: 86dvh;
      border: 0; padding: 0; border-radius: 24px 24px 0 0; background: #ffffff;
      box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.16);
    }
    dialog.tds-sheet::backdrop { background: rgba(0, 0, 0, 0.45); }
    .tds-sheet-in { padding: 20px 0 24px; max-height: 86dvh; overflow-y: auto; }
    .tds-sheet-head { padding: 0 20px 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .tds-sheet-close { border: 0; background: var(--grey100); color: var(--grey700); width: 30px; height: 30px; border-radius: 999px; cursor: pointer; font-weight: 700; }
    .tds-sheet-body { padding: 4px 20px 16px; font-size: 15px; line-height: 24px; color: var(--grey700); white-space: pre-wrap; }
    .tds-bottom-cta { padding: 12px 20px 0; }
  </style>
</head>
<body>
  <div class="app">
    <header class="tds-navbar">
      <span class="tds-brand">틈</span>
      <button type="button" class="tds-nav-pill" id="classPill">서전고 1-1</button>
    </header>

    <main id="main"></main>

    <nav class="tds-bottom-nav" aria-label="하단 메뉴">
      <button type="button" class="tds-bnav-btn" data-tab="home" aria-current="page">
        <svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5.5v-6.5h-5V21H4a1 1 0 0 1-1-1z"/></svg>
        <span>홈</span>
      </button>
      <button type="button" class="tds-bnav-btn" data-tab="forest">
        <svg viewBox="0 0 24 24"><path d="M12 3l-5.5 7.5h3.2L5.5 16h13l-4.2-5.5h3.2L12 3zM11 16v5h2v-5h-2z"/></svg>
        <span>숲</span>
      </button>
      <button type="button" class="tds-bnav-btn" data-tab="explore">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="15.8,8.2 13.7,13.7 8.2,15.8 10.3,10.3"/></svg>
        <span>탐색</span>
      </button>
      <button type="button" class="tds-bnav-btn" data-tab="my">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="4"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>
        <span>마이</span>
      </button>
    </nav>
  </div>

  <dialog id="sheet" class="tds-sheet">
    <div class="tds-sheet-in">
      <div class="tds-sheet-head">
        <div>
          <div class="tds-top-sub" id="sSub"></div>
          <h2 class="tds-t4" id="sTitle"></h2>
        </div>
        <button type="button" class="tds-sheet-close" id="sClose" aria-label="닫기">✕</button>
      </div>
      <div class="tds-sheet-body" id="sBody"></div>
      <div class="tds-bottom-cta" id="sCtaWrap"></div>
    </div>
  </dialog>

  <script>
    (function () {
      const POSTS = [
        { id: 'p1', tag: '공약', badge: 'blue', date: '11.20', dept: '남윤아 × 임준서', title: '제10대 학생자치회 공약 자세히 보기', sub: '틈·뜰·터·숲 마스터플랜', body: '말뿐인 종이 공약 대신 지금 바로 쓰는 0.5초 포털과 4대 실행 계획을 정리했습니다.', ctaText: '공약 매거진 열기', ctaUrl: '../pledge.html' },
        { id: 'p2', tag: '공간', badge: 'green', date: '11.18', dept: '환경복지부', title: '1층 지산실 안뜰 전면 개방 안내', sub: '평일 점심 12:40~13:25', body: '10년간 닫혀 있던 지산실 폴딩도어를 열고 학생 자율 휴식 공간을 엽니다.' },
        { id: 'p3', tag: '행사', badge: 'grey', date: '11.15', dept: '기획홍보부', title: '12.29 돌실제 동아리 부스 신청', sub: '마감 D-6 · 부스 모집 중', body: '동아리 부스 참가 신청 및 행사 타임테이블을 안내합니다.' }
      ];
      const FOREST = [
        { type: '회계', title: '학생회 간식사업 쌀빵 구입', meta: '환경복지부 · 11.19', right: '-184,000원', badge: 'red', body: '영수증 번호 #2026-11-04 확인 완료' },
        { type: '회의록', title: '제4차 정기 대의원회 회의록', meta: '문서관리부 · 11.14', right: '안건 3건', badge: 'blue', body: '1. 지산실 에티켓\n2. 돌실제 부스 배정' },
        { type: '회계', title: '2학기 학생자치회 운영비 교부', meta: '학생회 · 11.01', right: '+450,000원', badge: 'green', body: '2학기 기본 운영 예산 배정' }
      ];
      const TT = {
        '1-1': ['국어', '수학', '영어', '통합사회', '통합과학', '체육', '창체'],
        '1-2': ['수학', '영어', '국어', '통합과학', '한국사', '미술', '자율']
      };
      let tab = 'home', cls = '1-1', expCat = '전체';
      const $ = (id) => document.getElementById(id);

      function openSheet(sub, title, body, ctaText, ctaUrl) {
        $('sSub').textContent = sub;
        $('sTitle').textContent = title;
        $('sBody').textContent = body;
        $('sCtaWrap').innerHTML = ctaText
          ? `<button type="button" class="tds-btn primary" style="width:100%" id="sCtaBtn">${ctaText}</button>`
          : `<button type="button" class="tds-btn dark-weak" style="width:100%" id="sCtaBtn">확인</button>`;
        $('sCtaBtn').onclick = () => {
          if (ctaUrl) window.location.href = ctaUrl;
          else $('sheet').close();
        };
        $('sheet').showModal();
      }
      $('sClose').onclick = () => $('sheet').close();
      $('sheet').onclick = (e) => { if (e.target === $('sheet')) $('sheet').close(); };

      function render() {
        const m = $('main');
        if (tab === 'home') {
          m.innerHTML = `
            <section class="tds-top">
              <div class="tds-top-sub">서전고 ${cls}반 · TDS Mobile 시안</div>
              <h1 class="tds-t2">오늘 점심은 비빔밥,<br>다음은 3교시 영어예요</h1>
              <p class="tds-caption">625.3 Kcal · 점심시간까지 1시간 20분 남았어요</p>
            </section>
            <div class="tds-btn-wrap">
              <button type="button" class="tds-btn weak" id="btnMeal">오늘 급식 전체</button>
              <button type="button" class="tds-btn primary" id="btnPledge">공약 보기</button>
            </div>
            <div class="tds-dish-box">
              <span class="tds-chip">비빔밥</span><span class="tds-chip">두부미역된장국</span>
              <span class="tds-chip is-warn">고르곤졸라피자</span><span class="tds-chip">나박김치</span>
            </div>
            <div class="tds-gap"></div>
            <section class="tds-section">
              <div class="tds-sec-head"><h2 class="tds-sec-title">중요 공지</h2><button type="button" class="tds-sec-more" id="goExplore">전체보기</button></div>
              ${POSTS.map((p) => `
                <button type="button" class="tds-listrow" data-post="${p.id}">
                  <div class="tds-lr-left is-thumb">${p.tag}</div>
                  <div class="tds-lr-contents">
                    <div class="tds-lr-title">${p.title}</div>
                    <div class="tds-lr-sub">${p.dept} · ${p.sub}</div>
                  </div>
                  <div class="tds-lr-right"><span class="tds-chevron">›</span></div>
                </button>`).join('')}
            </section>
            <div class="tds-gap"></div>
            <section class="tds-section">
              <div class="tds-sec-head"><h2 class="tds-sec-title">오늘 시간표</h2><span class="tds-badge blue">${cls}반</span></div>
              ${TT[cls].map((subj, i) => `
                <div class="tds-listrow" style="cursor:default">
                  <div class="tds-lr-left ${i === 2 ? 'is-blue' : ''}">${i + 1}교시</div>
                  <div class="tds-lr-contents">
                    <div class="tds-lr-title">${subj}</div>
                    <div class="tds-lr-sub">${['08:40','09:40','10:40','11:40','13:30','14:30','15:30'][i]} 시작</div>
                  </div>
                  <div class="tds-lr-right">${i === 2 ? '<span class="tds-badge blue">수업 중</span>' : ''}</div>
                </div>`).join('')}
            </section>`;
          $('btnMeal').onclick = () => openSheet('11월 23일 중식 · 625.3 Kcal', '오늘의 급식 메뉴', '비빔밥\n두부미역된장국\n갈릭고르곤졸라피자 (알레르기 주의)\n나박김치\n하동매실주스100\n모듬피클');
          $('btnPledge').onclick = () => openSheet('제10대 학생자치회', POSTS[0].title, POSTS[0].body, POSTS[0].ctaText, POSTS[0].ctaUrl);
          $('goExplore').onclick = () => switchTab('explore');
          m.querySelectorAll('[data-post]').forEach((el) => {
            el.onclick = () => { const p = POSTS.find((x) => x.id === el.dataset.post); openSheet(`${p.dept} · ${p.date}`, p.title, p.body, p.ctaText, p.ctaUrl); };
          });
        } else if (tab === 'forest') {
          m.innerHTML = `
            <section class="tds-top">
              <div class="tds-top-sub">투명 공개실</div>
              <h1 class="tds-t2">학생회비와 회의록을<br>1원까지 확인해요</h1>
            </section>
            <div class="tds-ledger">
              <div><span class="tds-ledger-lbl">총 수입</span><span class="tds-ledger-val">450,000원</span></div>
              <div><span class="tds-ledger-lbl">총 지출</span><span class="tds-ledger-val" style="color:var(--red500)">184,000원</span></div>
              <div><span class="tds-ledger-lbl">잔액</span><span class="tds-ledger-val" style="color:var(--blue500)">266,000원</span></div>
            </div>
            <div class="tds-gap"></div>
            <section class="tds-section">
              <div class="tds-sec-head"><h2 class="tds-sec-title">최근 내역</h2></div>
              ${FOREST.map((it, idx) => `
                <button type="button" class="tds-listrow" data-f="${idx}">
                  <div class="tds-lr-left ${it.badge === 'green' ? 'is-green' : 'is-blue'}">${it.type}</div>
                  <div class="tds-lr-contents">
                    <div class="tds-lr-title">${it.title}</div>
                    <div class="tds-lr-sub">${it.meta}</div>
                  </div>
                  <div class="tds-lr-right"><span class="tds-badge ${it.badge}">${it.right}</span></div>
                </button>`).join('')}
            </section>`;
          m.querySelectorAll('[data-f]').forEach((el) => {
            el.onclick = () => { const it = FOREST[Number(el.dataset.f)]; openSheet(it.meta, it.title, it.body); };
          });
        } else if (tab === 'explore') {
          const cats = ['전체', '공약', '공간', '행사'];
          const list = POSTS.filter((p) => expCat === '전체' || p.tag === expCat);
          m.innerHTML = `
            <section class="tds-top">
              <div class="tds-top-sub">학교 소식 아카이브</div>
              <h1 class="tds-t2">놓친 공지와 행사 글</h1>
            </section>
            <div class="tds-tabs">${cats.map((c) => `<button type="button" class="tds-tab ${c === expCat ? 'is-active' : ''}" data-c="${c}">${c}</button>`).join('')}</div>
            <div style="padding-top:8px">
              ${list.map((p) => `
                <button type="button" class="tds-listrow" data-post="${p.id}">
                  <div class="tds-lr-left is-thumb">${p.tag}</div>
                  <div class="tds-lr-contents">
                    <div class="tds-lr-title">${p.title}</div>
                    <div class="tds-lr-sub">${p.date} · ${p.dept}</div>
                  </div>
                  <div class="tds-lr-right"><span class="tds-chevron">›</span></div>
                </button>`).join('')}
            </div>`;
          m.querySelectorAll('[data-c]').forEach((el) => { el.onclick = () => { expCat = el.dataset.c; render(); }; });
          m.querySelectorAll('[data-post]').forEach((el) => {
            el.onclick = () => { const p = POSTS.find((x) => x.id === el.dataset.post); openSheet(`${p.dept} · ${p.date}`, p.title, p.body, p.ctaText, p.ctaUrl); };
          });
        } else {
          m.innerHTML = `
            <section class="tds-top">
              <div class="tds-top-sub">개인화 설정</div>
              <h1 class="tds-t2">내 학급과 알림</h1>
            </section>
            <button type="button" class="tds-listrow" id="toggleCls">
              <div class="tds-lr-left is-blue">반</div>
              <div class="tds-lr-contents"><div class="tds-lr-title">우리 반 변경</div><div class="tds-lr-sub">현재 서전고 ${cls}반 시간표 연동 중</div></div>
              <div class="tds-lr-right"><span class="tds-badge blue">${cls}</span><span class="tds-chevron">›</span></div>
            </button>
            <button type="button" class="tds-listrow" id="goPledge">
              <div class="tds-lr-left is-green">공약</div>
              <div class="tds-lr-contents"><div class="tds-lr-title">제10대 학생자치회 공약 보기</div><div class="tds-lr-sub">틈·뜰·터·숲 매거진</div></div>
              <div class="tds-lr-right"><span class="tds-chevron">›</span></div>
            </button>`;
          $('toggleCls').onclick = () => { cls = cls === '1-1' ? '1-2' : '1-1'; $('classPill').textContent = `서전고 ${cls}`; render(); };
          $('goPledge').onclick = () => { window.location.href = '../pledge.html'; };
        }
      }

      function switchTab(next) {
        tab = next;
        document.querySelectorAll('.tds-bnav-btn').forEach((b) => b.setAttribute('aria-current', b.dataset.tab === next ? 'page' : 'false'));
        render();
      }

      $('classPill').onclick = () => { cls = cls === '1-1' ? '1-2' : '1-1'; $('classPill').textContent = `서전고 ${cls}`; render(); };
      document.querySelectorAll('.tds-bnav-btn').forEach((b) => { b.onclick = () => switchTab(b.dataset.tab); });
      render();
    })();
  </script>
</body>
</html>
